<header class="app-header">
  <a routerLink="/tracks" class="brand">
    <span class="logo" aria-hidden="true">♪</span>
    Takwene <span class="brand-sub">Track Management</span>
  </a>

  @if (auth.user(); as user) {
    <nav class="nav" aria-label="Main">
      <a routerLink="/tracks" routerLinkActive="active">Tracks</a>
      <a routerLink="/artists" routerLinkActive="active">Artists</a>
    </nav>
    <div class="user">
      <span class="user-name" [title]="user.email">{{ user.fullName }}</span>
      <button type="button" class="secondary" (click)="auth.logout()">Sign out</button>
    </div>
  }
</header>

<main class="app-main">
  <!-- Pages only load (and call the API) once someone is signed in. -->
  @if (auth.isAuthenticated()) {
    <router-outlet />
  }
</main>

@if (!auth.isAuthenticated()) {
  <app-auth-modal />
}
